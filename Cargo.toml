[workspace]
resolver = "2"
members = [
  "crates/keeldesk-core",
  "crates/tauri-plugin-keeldesk",
  "apps/env-workbench/src-tauri",
]

[workspace.package]
version = "0.1.0"
authors = ["Leon Zeng"]
license = "MIT"
repository = "https://github.com/ZengLiangYi/KeelDesk"
edition = "2021"

[workspace.dependencies]
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rmcp = { version = "3.10", features = [
  "server",
  "client",
  "macros",
  "schemars",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
  "reqwest-native-tls",
] }
axum = "0.8"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1.0"
windows = { version = "0.61" }
